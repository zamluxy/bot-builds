name: Web to APK

# Dipicu oleh bot (ghbuild.triggerWorkflow). Ketiga input di bawah WAJIB ada,
# karena bot selalu mengirim build_type + flutter_version + release_tag.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'apk-release | apk-debug'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - apk-debug
      flutter_version:
        description: 'Versi Flutter (kosong = default workflow)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Tag release yang berisi web2apk-project.zip (dari bot)'
        required: true
        type: string

permissions:
  contents: read

env:
  DEFAULT_FLUTTER: '3.24.5'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ------------------------------------------------------------
      - name: Download project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ASSET_API=""
          for i in $(seq 1 15); do
            echo "Mencari paket project ($i/15)..."
            REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            ASSET_API=$(echo "$REL" | jq -r '.assets[0].url // empty')
            [ -n "$ASSET_API" ] && break
            sleep 3
          done
          if [ -z "$ASSET_API" ]; then
            echo "###BOT_ERROR_START###"
            echo "Paket project tidak ditemukan di server build."
            echo "###BOT_ERROR_END###"
            exit 1
          fi
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o web2apk-project.zip "$ASSET_API"
          mkdir payload && unzip -q web2apk-project.zip -d payload
          ls -la payload
          echo "Project diterima ($(du -h web2apk-project.zip | cut -f1))"

      # ------------------------------------------------------------
      - name: Prepare project
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          def fail(msg):
              print("###BOT_ERROR_START###"); print(msg); print("###BOT_ERROR_END###"); sys.exit(1)
          try:
              cfg = json.load(open("payload/config.json", encoding="utf-8"))
          except Exception as e:
              fail("config.json tidak valid: %s" % e)
          name = re.sub(r"[^\w \-]", "", str(cfg.get("name", "")), flags=re.U).strip()[:30] or "App"
          slug = re.sub(r"[^a-z0-9]", "", str(cfg.get("slug", "")).lower())[:20] or "app"
          mode = "html" if cfg.get("mode") == "html" else "url"
          url = str(cfg.get("url", ""))
          if mode == "url" and not re.match(r"^https?://\S+$", url):
              fail("URL web tidak valid.")
          if mode == "html" and not os.path.isfile("payload/index.html"):
              fail("File HTML tidak ada di paket.")
          abi = str(cfg.get("abi", "both")).lower()
          target = "android-arm64" if abi == "arm64" else "android-arm,android-arm64"
          initial = name[:1].upper()
          if not re.match(r"[A-Z0-9]", initial): initial = "W"
          # Orientasi layar
          orientation = str(cfg.get("orientation", "portrait")).lower()
          if orientation not in ("portrait", "landscape", "auto"):
              orientation = "portrait"
          android_orient_map = {"portrait": "portrait", "landscape": "landscape", "auto": "fullSensor"}
          android_orient = android_orient_map.get(orientation, "portrait")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("APP_LABEL=%s\nAPP_SLUG=%s\nAPP_INITIAL=%s\nAPP_MODE=%s\nAPP_TARGET=%s\nAPP_ORIENTATION=%s\nANDROID_ORIENTATION=%s\n"
                      % (name, slug, initial, mode, target, orientation, android_orient))
          print("Nama: %s | mode: %s | id: w2a_%s | orientasi: %s" % (name, mode, slug, orientation))
          PY

      # ------------------------------------------------------------
      - name: Encrypt content
        run: |
          python3 - <<'PY'
          import json, os, base64, sys

          cfg = json.load(open("payload/config.json", encoding="utf-8"))
          mode = "html" if cfg.get("mode") == "html" else "url"

          # Data sensitif: mode + url/html
          sensitive = {
              "mode": mode,
              "url": cfg.get("url", ""),
              "name": cfg.get("name", "App"),
          }
          if mode == "html" and os.path.isfile("payload/index.html"):
              sensitive["html"] = open("payload/index.html", encoding="utf-8").read()

          # Generate 64-byte random XOR key
          key = os.urandom(64)

          # Enkripsi XOR: setiap byte di-XOR dengan key[i % 64]
          data = json.dumps(sensitive, separators=(',', ':')).encode("utf-8")
          encrypted = bytes(b ^ key[i % len(key)] for i, b in enumerate(data))
          enc_b64 = base64.b64encode(encrypted).decode("ascii")

          # Simpan ciphertext
          with open("payload/app_data.enc", "w") as f:
              f.write(enc_b64)

          # Simpan key sebagai 4 bagian (masing-masing 32 hex char = 16 byte)
          key_hex = key.hex()   # 128 hex chars total
          parts = [key_hex[i*32:(i+1)*32] for i in range(4)]
          with open("payload/key_parts.txt", "w") as f:
              f.write("\n".join(parts))

          print("✔ Konten dienkripsi: %d byte plaintext → %d char base64" % (len(data), len(enc_b64)))
          print("✔ XOR key 64-byte dibuat dan disimpan ke key_parts.txt")
          PY

      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version != '' && inputs.flutter_version || env.DEFAULT_FLUTTER }}
          channel: stable
          cache: true

      # ------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: w2a-gradle-${{ runner.os }}-${{ inputs.flutter_version != '' && inputs.flutter_version || env.DEFAULT_FLUTTER }}-v1

      # ------------------------------------------------------------
      - name: Create app
        run: |
          flutter --version
          flutter create --org com.celestial.web2apk --project-name "w2a_${APP_SLUG}" \
            --platforms android --empty app
          cd app
          # versi dipatok yang cocok dengan Flutter 3.24; kalau gagal baru pakai versi terbaru yang kompatibel
          flutter pub add webview_flutter:4.9.0 url_launcher:6.3.0 || flutter pub add webview_flutter url_launcher
          mkdir -p assets
          cp ../payload/app_data.enc assets/app_data.enc
          python3 - <<'PY'
          import re, os

          # ── 1. pubspec: daftarkan satu folder assets/
          p = "pubspec.yaml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"(^flutter:[ \t]*\n)", r"\1  assets:\n    - assets/\n", s, count=1, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)

          # ── 2. AndroidManifest: label + internet + cleartext + orientasi
          m = "android/app/src/main/AndroidManifest.xml"
          x = open(m, encoding="utf-8").read()
          label = os.environ["APP_LABEL"]
          android_orient = os.environ["ANDROID_ORIENTATION"]
          x = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % label, x, count=1)
          if "android.permission.INTERNET" not in x:
              x = x.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          x = x.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          # Tambahkan screenOrientation ke activity utama
          x = re.sub(
              r'(<activity\b[^>]*?)(\s*android:name="\.MainActivity")',
              lambda mo: mo.group(1) + (' android:screenOrientation="%s"' % android_orient) + mo.group(2),
              x, count=1
          )
          if 'android:screenOrientation' not in x:
              x = x.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:screenOrientation="%s"' % android_orient
              )
          open(m, "w", encoding="utf-8").write(x)

          # ── 3. Layar penuh sampai area poni/kamera
          sx = "android/app/src/main/res/values/styles.xml"
          if os.path.exists(sx):
              t = open(sx, encoding="utf-8").read()
              if "windowLayoutInDisplayCutoutMode" not in t:
                  t = t.replace("</style>", '    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n    </style>')
                  open(sx, "w", encoding="utf-8").write(t)

          # ── 4. Build lebih cepat: lewati lint release, gradle paralel + cache
          for gf in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              if os.path.exists(gf):
                  with open(gf, "a", encoding="utf-8") as f:
                      if gf.endswith(".kts"):
                          f.write("\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n")
                      else:
                          f.write("\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n")
                  break
          gp = "android/gradle.properties"
          if os.path.exists(gp):
              with open(gp, "a", encoding="utf-8") as f:
                  f.write("\norg.gradle.parallel=true\norg.gradle.caching=true\n")

          # ── 5. Generate lib/app_crypto.dart dengan key terenkripsi + orientasi
          parts = open("../payload/key_parts.txt").read().strip().split("\n")
          orientation = os.environ["APP_ORIENTATION"]
          dart_crypto = (
              "// AUTO-GENERATED — jangan edit manual\n"
              "// ignore_for_file: constant_identifier_names, prefer_single_quotes\n"
              "const String kK0 = '%s';\n"
              "const String kK1 = '%s';\n"
              "const String kK2 = '%s';\n"
              "const String kK3 = '%s';\n"
              "// kK0+kK1+kK2+kK3 = 128 hex char = kunci XOR 64-byte\n"
              "const String kAppOrientation = '%s'; // portrait | landscape | auto\n"
          ) % (parts[0], parts[1], parts[2], parts[3], orientation)
          with open("lib/app_crypto.dart", "w", encoding="utf-8") as f:
              f.write(dart_crypto)
          print("✔ app_crypto.dart dibuat dengan kunci tertanam")
          print("✔ Orientasi layar: %s → Android: %s" % (orientation, android_orient))
          PY

      # ------------------------------------------------------------
      - name: Write app code
        run: |
          cat > app/lib/main.dart << 'DART'
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'app_crypto.dart';

          // Konversi hex string → Uint8List
          Uint8List _fromHex(String hex) => Uint8List.fromList(
              List.generate(hex.length ~/ 2,
                  (i) => int.parse(hex.substring(i * 2, i * 2 + 2), radix: 16)));

          // Dekripsi XOR: setiap byte di-XOR dengan key[i % key.length]
          Uint8List _xorDecrypt(Uint8List data, Uint8List key) =>
              Uint8List.fromList(
                  List.generate(data.length, (i) => data[i] ^ key[i % key.length]));

          // Daftar orientasi berdasarkan konstanta kAppOrientation
          List<DeviceOrientation> _preferredOrientations() {
            switch (kAppOrientation) {
              case 'landscape':
                return [DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight];
              case 'auto':
                return [];
              default:
                return [DeviceOrientation.portraitUp, DeviceOrientation.portraitDown];
            }
          }

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            // Set orientasi layar sesuai pilihan build
            await SystemChrome.setPreferredOrientations(_preferredOrientations());
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);

            // Muat & dekripsi data terenkripsi dari assets
            final encB64 = await rootBundle.loadString('assets/app_data.enc');
            final key = _fromHex(kK0 + kK1 + kK2 + kK3);
            final decBytes = _xorDecrypt(base64Decode(encB64.trim()), key);
            final cfg = jsonDecode(utf8.decode(decBytes)) as Map<String, dynamic>;

            runApp(WebApp(cfg: cfg));
          }

          class WebApp extends StatelessWidget {
            const WebApp({super.key, required this.cfg});
            final Map<String, dynamic> cfg;

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: (cfg['name'] ?? 'App').toString(),
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: const Color(0xFF4F46E5)),
                home: WebPage(cfg: cfg),
              );
            }
          }

          class WebPage extends StatefulWidget {
            const WebPage({super.key, required this.cfg});
            final Map<String, dynamic> cfg;

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController _c;
            int _progress = 0;
            bool _error = false;

            @override
            void initState() {
              super.initState();
              _c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(Colors.white)
                ..setNavigationDelegate(NavigationDelegate(
                  onProgress: (p) => setState(() => _progress = p),
                  onPageStarted: (_) => setState(() => _error = false),
                  onWebResourceError: (e) {
                    if (e.isForMainFrame ?? true) setState(() => _error = true);
                  },
                  onNavigationRequest: (req) async {
                    final uri = Uri.tryParse(req.url);
                    const ok = ['http', 'https', 'file', 'about', 'data', 'blob', 'javascript'];
                    if (uri != null && !ok.contains(uri.scheme)) {
                      try {
                        await launchUrl(uri, mode: LaunchMode.externalApplication);
                      } catch (_) {}
                      return NavigationDecision.prevent;
                    }
                    return NavigationDecision.navigate;
                  },
                ));
              _open();
            }

            void _open() {
              if (widget.cfg['mode'] == 'html') {
                // HTML di-load dari string (bukan dari file asset — lebih aman)
                _c.loadHtmlString(widget.cfg['html']?.toString() ?? '');
              } else {
                _c.loadRequest(Uri.parse(widget.cfg['url'].toString()));
              }
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  if (await _c.canGoBack()) {
                    await _c.goBack();
                  } else {
                    SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  backgroundColor: Colors.white,
                  body: SizedBox.expand(
                    child: Stack(children: [
                      WebViewWidget(controller: _c),
                      if (_progress < 100 && !_error)
                        LinearProgressIndicator(value: _progress / 100, minHeight: 3),
                      if (_error)
                        Container(
                          color: Colors.white,
                          alignment: Alignment.center,
                          child: Column(mainAxisSize: MainAxisSize.min, children: [
                            const Icon(Icons.wifi_off_rounded, size: 56),
                            const SizedBox(height: 12),
                            const Text('Tidak bisa memuat halaman'),
                            const SizedBox(height: 12),
                            FilledButton(
                              onPressed: () {
                                setState(() => _error = false);
                                _open();
                              },
                              child: const Text('Coba lagi'),
                            ),
                          ]),
                        ),
                    ]),
                  ),
                ),
              );
            }
          }
          DART

      # ------------------------------------------------------------
      - name: Process icon
        run: |
          # ImageMagick TIDAK ada di runner ubuntu-24.04 → pakai Pillow (Python)
          if ! python3 -c "import PIL" 2>/dev/null; then
            echo "Memasang Pillow..."
            python3 -m pip install --quiet --break-system-packages pillow \
              || python3 -m pip install --quiet pillow \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil; }
          fi
          python3 - <<'PY'
          import glob, os, sys
          from PIL import Image
          os.chdir("app")
          os.makedirs("assets", exist_ok=True)

          def default_icon(initial):
              img = Image.new("RGB", (1080, 1080))
              a, b = (79, 70, 229), (236, 72, 153)
              img.putdata([tuple(int(a[i] + (b[i] - a[i]) * (x + y) / 2158) for i in range(3))
                           for y in range(1080) for x in range(1080)])
              return img.convert("RGBA")

          icon = None
          srcs = sorted(glob.glob("../payload/icon.*"))
          if srcs:
              try:
                  im = Image.open(srcs[0])
                  im.seek(0)
                  im = im.convert("RGBA")
                  w, h = im.size
                  s = min(w, h)
                  l, t = (w - s) // 2, (h - s) // 2
                  icon = im.crop((l, t, l + s, t + s)).resize((1080, 1080), Image.LANCZOS)
                  print("Ikon custom diproses: %dx%d -> 1080x1080 (crop tengah 1:1)" % (w, h))
              except Exception as e:
                  print("Ikon custom gagal dibaca (%s), memakai ikon default" % e)
          if icon is None:
              icon = default_icon(os.environ.get("APP_INITIAL", "W"))
              print("Ikon default dipakai")
          icon.save("assets/icon.png")

          res = "android/app/src/main/res"
          for d, px in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              os.makedirs("%s/mipmap-%s" % (res, d), exist_ok=True)
              icon.resize((px, px), Image.LANCZOS).save("%s/mipmap-%s/ic_launcher.png" % (res, d))
              print("ic_launcher %s %dx%d" % (d, px, px))
          PY

      # ------------------------------------------------------------
      - name: Build APK
        run: |
          cd app
          echo "Target ABI: $APP_TARGET | Orientasi: $APP_ORIENTATION"
          if [ "${{ inputs.build_type }}" = "apk-debug" ]; then
            flutter build apk --debug --target-platform "$APP_TARGET"
            SRC=build/app/outputs/flutter-apk/app-debug.apk
          else
            flutter build apk --release --target-platform "$APP_TARGET" \
              --obfuscate --split-debug-info=build/symbols
            SRC=build/app/outputs/flutter-apk/app-release.apk
          fi
          if [ ! -f "$SRC" ]; then
            echo "###BOT_ERROR_START###"
            echo "APK tidak ditemukan setelah build."
            echo "###BOT_ERROR_END###"
            exit 1
          fi
          mkdir -p ../out && cp "$SRC" ../out/app.apk
          echo "APK siap ($(du -h ../out/app.apk | cut -f1))"

      # ------------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-apk
          path: out/app.apk
          retention-days: 1
          if-no-files-found: error
