name: Flutter Build Bot

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build: apk-debug | apk-release | aab-release'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-debug
          - apk-release
          - aab-release
      flutter_version:
        description: 'Flutter version override (kosongkan untuk default)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release tag dari bot Telegram'
        required: false
        default: ''
        type: string

  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'assets/**'

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ DOWNLOAD ZIP DARI RELEASE BOT
      # ============================================
      - name: 📥 Download Project ZIP from Bot Release
        if: github.event.inputs.release_tag != ''
        run: |
          echo "📥 Mendownload project dari release: ${{ github.event.inputs.release_tag }}"

          echo "⏳ Menunggu 2 detik..."
          sleep 2

          MAX_RETRY=12
          RETRY=0
          ASSET_URL=""

          while [ $RETRY -lt $MAX_RETRY ]; do
            echo "🔍 Attempt $((RETRY+1))/$MAX_RETRY: Mencari release..."

            RELEASE_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.release_tag }}")

            RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')

            if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
              echo "✅ Release ditemukan! ID: $RELEASE_ID"

              ASSET_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].browser_download_url')

              if [ "$ASSET_URL" != "null" ] && [ -n "$ASSET_URL" ]; then
                echo "✅ Asset ditemukan"
                break
              else
                echo "⚠️ Release ada tapi asset belum siap, tunggu 3 detik..."
                sleep 3
              fi
            else
              echo "⚠️ Release belum ditemukan, tunggu 3 detik..."
              sleep 3
            fi

            RETRY=$((RETRY+1))
          done

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "###BOT_ERROR_START###"
            echo "❌ Gagal mendapatkan asset ZIP dari release setelah $MAX_RETRY kali percobaan."
            echo "Release response: $(echo "$RELEASE_RESPONSE" | jq -r '.message // "tidak ada asset"')"
            echo "###BOT_ERROR_END###"
            exit 1
          fi

          echo "📦 Mendownload asset release..."
          curl -sSL -o project.zip "$ASSET_URL"

          if [ ! -f project.zip ]; then
            echo "###BOT_ERROR_START###"
            echo "❌ File ZIP gagal didownload dari release."
            echo "###BOT_ERROR_END###"
            exit 1
          fi

          echo "📏 Size: $(du -h project.zip | cut -f1)"

          echo "📂 Mengekstrak ZIP..."
          mkdir -p project_extracted
          unzip -o project.zip -d project_extracted/

          if [ -f "project_extracted/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml ditemukan di root ZIP"
            cp -rf project_extracted/* .
            cp -rf project_extracted/.* . 2>/dev/null || true
          else
            echo "🔍 Mencari pubspec.yaml di subfolder..."
            SUBFOLDER=$(find project_extracted -name "pubspec.yaml" -not -path "*/.*" | head -1)

            if [ -n "$SUBFOLDER" ]; then
              PROJECT_DIR=$(dirname "$SUBFOLDER")
              echo "✅ pubspec.yaml ditemukan di: $PROJECT_DIR"
              cp -rf "$PROJECT_DIR"/* .
              cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
            else
              echo "###BOT_ERROR_START###"
              echo "❌ pubspec.yaml TIDAK DITEMUKAN di dalam ZIP."
              echo "Isi ZIP (maks 50 baris):"
              ls -laR project_extracted/ | head -50
              echo "###BOT_ERROR_END###"
              exit 1
            fi
          fi

          rm -rf project_extracted project.zip

          echo "✅ Project siap:"
          echo "---"
          ls -la
          echo "---"
          head -20 pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ============================================
      # 🔎 AUTO-DETECT VERSI FLUTTER DARI pubspec.yaml
      #    (environment: sdk: >=X) supaya tidak bentrok SDK
      # ============================================
      - name: 🔎 Detect Required Flutter Version
        id: flutter_ver
        run: |
          cat > /tmp/flutter_pick.sh << 'PICK_EOF'
          # dart_to_flutter <major.minor Dart> -> versi Flutter stable yang membawa Dart tsb
          dart_to_flutter() {
            local M="${1%%.*}" m="${1#*.}"; m="${m%%.*}"
            if [ "$M" -gt 3 ] 2>/dev/null; then echo "latest"; return; fi
            if [ "$M" -lt 3 ] 2>/dev/null; then echo "3.32.8"; return; fi   # Dart 2.x -> default
            if   [ "$m" -le 8 ]  2>/dev/null; then echo "3.32.8"   # Dart 3.8.x (default lama)
            elif [ "$m" -eq 9 ]  2>/dev/null; then echo "3.35.x"   # Dart 3.9
            elif [ "$m" -eq 10 ] 2>/dev/null; then echo "3.38.x"   # Dart 3.10
            else echo "latest"; fi                                 # Dart 3.11+ -> stable terbaru
          }
          PICK_EOF

          source /tmp/flutter_pick.sh
          INPUT="${{ github.event.inputs.flutter_version }}"
          REQ=""
          if [ -f pubspec.yaml ]; then
            REQ=$(awk '/^environment:/{e=1;next} e&&/^[^ \t#]/{e=0} e&&/^[ \t]+sdk:/{print;exit}' pubspec.yaml | grep -oP '[0-9]+\.[0-9]+' | head -1 || true)
          fi

          if [ -n "$INPUT" ]; then
            V="$INPUT"; echo "📌 Pakai Flutter dari input manual: $V"
          elif [ -n "$REQ" ]; then
            V=$(dart_to_flutter "$REQ"); echo "🔎 pubspec butuh Dart >= $REQ -> Flutter $V"
          else
            V="3.32.8"; echo "ℹ️ SDK constraint tidak terbaca -> default Flutter $V"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_ver.outputs.version != 'latest' && steps.flutter_ver.outputs.version || '' }}
          channel: 'stable'
          cache: true

      # ============================================
      # 🎨 REGENERATE LAUNCHER ICONS (FIX UTAMA)
      #    apt dibatasi timeout supaya tidak hang
      #    kalau mirror Azure bermasalah
      # ============================================
      - name: 🎨 Regenerate Launcher Icons
        timeout-minutes: 5
        run: |
          echo "=========================================="
          echo "=== REGENERATING LAUNCHER ICONS ==="
          echo "=========================================="

          IM=""
          if command -v magick >/dev/null 2>&1; then IM="magick"
          elif command -v convert >/dev/null 2>&1; then IM="convert"
          else
            echo "📦 Installing ImageMagick (dengan timeout)..."
            sudo timeout 60 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update -qq || true
            sudo timeout 120 apt-get install -y -qq imagemagick || true
            if command -v magick >/dev/null 2>&1; then IM="magick"
            elif command -v convert >/dev/null 2>&1; then IM="convert"
            else
              echo "###BOT_ERROR_START###"
              echo "❌ ImageMagick gagal dipasang (mirror apt bermasalah). Coba jalankan ulang build."
              echo "###BOT_ERROR_END###"
              exit 1
            fi
          fi
          echo "✅ Pakai: $IM"

          # semua pemanggilan `convert` di bawah otomatis pakai binary yang ada
          if [ "$IM" = "magick" ]; then convert() { magick "$@"; }; fi

          SOURCE_ICON=""
          if [ -f "assets/icon/icon.jpg" ]; then
            SOURCE_ICON="assets/icon/icon.jpg"
          elif [ -f "assets/icon/icon.png" ]; then
            SOURCE_ICON="assets/icon/icon.png"
          elif [ -f "assets/icon/icon.webp" ]; then
            SOURCE_ICON="assets/icon/icon.webp"
          fi

          if [ -n "$SOURCE_ICON" ]; then
            echo "✅ Source icon found: $SOURCE_ICON"

            echo "🗑️ Removing all existing ic_launcher files..."
            find android/app/src/main/res -name "ic_launcher*" -type f -delete

            echo "🎨 Creating icons for all densities..."

            mkdir -p android/app/src/main/res/mipmap-mdpi
            convert "$SOURCE_ICON" -resize 48x48 -gravity center -extent 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            echo "  ✅ mipmap-mdpi/ic_launcher.png (48x48)"

            mkdir -p android/app/src/main/res/mipmap-hdpi
            convert "$SOURCE_ICON" -resize 72x72 -gravity center -extent 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            echo "  ✅ mipmap-hdpi/ic_launcher.png (72x72)"

            mkdir -p android/app/src/main/res/mipmap-xhdpi
            convert "$SOURCE_ICON" -resize 96x96 -gravity center -extent 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            echo "  ✅ mipmap-xhdpi/ic_launcher.png (96x96)"

            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            convert "$SOURCE_ICON" -resize 144x144 -gravity center -extent 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            echo "  ✅ mipmap-xxhdpi/ic_launcher.png (144x144)"

            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            convert "$SOURCE_ICON" -resize 192x192 -gravity center -extent 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "  ✅ mipmap-xxxhdpi/ic_launcher.png (192x192)"

            echo "🎨 Creating adaptive icon (Android 8+)..."
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26

            mkdir -p android/app/src/main/res/drawable
            convert "$SOURCE_ICON" -resize 108x108 -gravity center -extent 108x108 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png

            convert "$SOURCE_ICON" -resize 72x72 -gravity center -extent 108x108 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

            cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF
            echo "  ✅ mipmap-anydpi-v26/ic_launcher.xml"

          else
            echo "⚠️ No source icon found, creating placeholder icons..."

            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi) SIZE="48x48" ;;
                hdpi) SIZE="72x72" ;;
                xhdpi) SIZE="96x96" ;;
                xxhdpi) SIZE="144x144" ;;
                xxxhdpi) SIZE="192x192" ;;
              esac

              OUTPUT_DIR="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$OUTPUT_DIR"

              convert -size "$SIZE" xc:'#2196F3' \
                -fill white -gravity center -pointsize 24 \
                -annotate 0 "App" \
                "$OUTPUT_DIR/ic_launcher.png"

              echo "  ✅ Placeholder: mipmap-${density}/ic_launcher.png (${SIZE})"
            done
          fi

          echo ""
          echo "=== ICON REGENERATION COMPLETE ==="
          echo "Files created:"
          find android/app/src/main/res -name "ic_launcher*" -type f | sort

      # ============================================
      # 🧹 CLEAN ICON RESOURCES (bersihkan duplikat)
      # ============================================
      - name: 🧹 Clean Icon Resources
        run: |
          echo "=========================================="
          echo "=== CLEANING ICON RESOURCES ==="
          echo "=========================================="

          echo "🗑️ Removing non-PNG icon files..."
          find android/app/src/main/res -type f \( \
            -name "ic_launcher.jpg" -o \
            -name "ic_launcher.webp" -o \
            -name "ic_launcher.gif" -o \
            -name "ic_launcher.bmp" -o \
            -name "ic_launcher_round.jpg" -o \
            -name "ic_launcher_round.webp" -o \
            -name "ic_launcher_round.gif" -o \
            -name "ic_launcher_foreground.jpg" -o \
            -name "ic_launcher_foreground.webp" -o \
            -name "ic_launcher_background.jpg" -o \
            -name "ic_launcher_background.webp" \
          \) -delete 2>/dev/null || true

          echo "🗑️ Removing 0-byte icon files..."
          find android/app/src/main/res -name "ic_launcher*" -type f -size 0 -delete 2>/dev/null || true

          echo ""
          echo "=== REMAINING ICON FILES ==="
          find android/app/src/main/res -name "ic_launcher*" -type f -exec ls -lh {} \; | sort

          echo ""
          echo "✅ Icon cleanup complete"

      # ============================================
      # 🔍 VALIDATE RESOURCES
      # ============================================
      - name: 🔍 Validate Android Resources
        run: |
          echo "=========================================="
          echo "=== VALIDATING ANDROID RESOURCES ==="
          echo "=========================================="

          ERROR_FOUND=0

          for png in $(find android/app/src/main/res -name "*.png" -type f); do
            SIZE=$(stat -c%s "$png" 2>/dev/null || echo 0)
            if [ "$SIZE" -eq 0 ]; then
              echo "❌ EMPTY FILE: $png (0 bytes)"
              ERROR_FOUND=1
              rm -f "$png"
              continue
            fi

            if command -v identify >/dev/null 2>&1; then
              if identify "$png" >/dev/null 2>&1; then
                DIMENSIONS=$(identify -format "%wx%h" "$png" 2>/dev/null)
                echo "  ✅ $png ($DIMENSIONS, ${SIZE} bytes)"
              else
                echo "❌ CORRUPT PNG: $png"
                ERROR_FOUND=1

                echo "  🔧 Attempting to fix..."
                convert -size 48x48 xc:'#2196F3' "$png" 2>/dev/null || {
                  echo "  ❌ Cannot fix, removing..."
                  rm -f "$png"
                }
              fi
            fi
          done

          if [ $ERROR_FOUND -eq 1 ]; then
            echo ""
            echo "⚠️ Some resources were corrupt and have been fixed/removed"
            echo "⚠️ You may need to check your source icon file"
          else
            echo ""
            echo "✅ All PNG resources are valid!"
          fi

          echo ""
          echo "=== FINAL CHECK: Required icons ==="
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON_PATH="android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            if [ -f "$ICON_PATH" ]; then
              SIZE=$(stat -c%s "$ICON_PATH")
              echo "  ✅ mipmap-${density}/ic_launcher.png ($SIZE bytes)"
            else
              echo "  ❌ MISSING: mipmap-${density}/ic_launcher.png"
              ERROR_FOUND=1
            fi
          done

          if [ $ERROR_FOUND -eq 1 ]; then
            echo "###BOT_ERROR_START###"
            echo "❌ Validasi resource icon gagal - ada ic_launcher.png yang hilang."
            echo "Ini akan menyebabkan build gagal di step selanjutnya."
            echo "###BOT_ERROR_END###"
          else
            echo ""
            echo "✅ VALIDATION PASSED - All resources are ready!"
          fi

      - name: Fix Java and Namespace
        run: |
          FILE_PATH="android/app/src/main/java/com/nullx/pp/SpService.java"
          if [ -f "$FILE_PATH" ]; then
            sed -i '/import com.nullx.pp.R;/d' "$FILE_PATH"
            echo "✅ Import R dihapus"
          fi

          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace 'com.nullx.pp'" "$BUILD_GRADLE"; then
              sed -i "/android {/a \    namespace 'com.nullx.pp'" "$BUILD_GRADLE"
              echo "✅ Namespace dipaksa ke com.nullx.pp"
            fi
          fi

      - name: Fix Kotlin Version Compatibility
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "kotlin_version" "$BUILD_GRADLE"; then
              sed -i "s/ext\.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.10'/" "$BUILD_GRADLE"
              echo "kotlin_version patched ke 1.9.10"
            else
              sed -i "/buildscript {/a\\    ext.kotlin_version = '1.9.10'" "$BUILD_GRADLE"
              echo "kotlin_version ditambahkan"
            fi
          fi
          echo "--- android/build.gradle ---"
          cat "$BUILD_GRADLE" 2>/dev/null || echo "(not found)"

      - name: 🔧 Fix minSdkVersion & AndroidManifest
        run: |
          echo "=== Fixing all gradle files ==="

          find android -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            echo "Processing: $f"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$f"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$f"
            sed -i 's/minSdk(flutter.minSdkVersion)/minSdk(23)/g' "$f"
            sed -i 's/minSdk = 21/minSdk = 23/g' "$f"
            sed -i 's/minSdk 21/minSdk 23/g' "$f"
          done

          echo "=== All gradle files fixed ==="
          grep -r "minSdk" android/ 2>/dev/null | head -10

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "=== Fixing AndroidManifest ==="

            if ! grep -q "xmlns:tools" "$MANIFEST"; then
              sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST"
              echo "✅ xmlns:tools added"
            fi

            if ! grep -q "overrideLibrary" "$MANIFEST"; then
              sed -i 's/<application/<application\n        tools:overrideLibrary="com.llfbandit.record"/' "$MANIFEST"
              echo "✅ overrideLibrary added"
            fi

            echo "--- AndroidManifest.xml ---"
            head -12 "$MANIFEST"
          fi

      - name: 🔧 Fix compileSdk, Assets & Java
        run: |
          echo "=========================================="
          echo "=== FIX 1: compileSdk ke 36 ==="
          echo "=========================================="

          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | while read f; do
            echo "=== Before: $f ==="
            grep -n "compileSdk" "$f" || echo "(no compileSdk found)"

            sed -i 's/compileSdkVersion\s*=\?\s*35/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion\s*=\?\s*34/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion\s*=\?\s*33/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*35/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*34/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*33/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk(35)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk(34)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk(33)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk\s\+35/compileSdk 36/g' "$f"
            sed -i 's/compileSdk\s\+34/compileSdk 36/g' "$f"

            echo "=== After: $f ==="
            grep -n "compileSdk" "$f" || echo "(no compileSdk)"
          done

          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion\s*=\?\s*35/compileSdkVersion 36/g' android/build.gradle
            sed -i 's/compileSdk\s*=\?\s*35/compileSdk = 36/g' android/build.gradle
          fi

          echo ""
          echo "=========================================="
          echo "=== FIX 2: Buat folder assets ==="
          echo "=========================================="

          for dir in assets assets/images assets/videos assets/audio assets/fonts assets/icons; do
            if [ ! -d "$dir" ]; then
              mkdir -p "$dir"
              touch "$dir/.gitkeep"
              echo "✅ Created: $dir/"
            else
              echo "✅ Exists: $dir/"
            fi
          done

          if [ -f pubspec.yaml ]; then
            echo "Reading pubspec.yaml for assets..."
            grep -E "^\s+-\s+" pubspec.yaml | sed 's/.*- //' | while read asset; do
              if echo "$asset" | grep -q "/$"; then
                if [ ! -d "$asset" ]; then
                  mkdir -p "$asset"
                  touch "$asset/.gitkeep"
                  echo "✅ Created from pubspec: $asset"
                fi
              else
                PARENT_DIR=$(dirname "$asset")
                if [ "$PARENT_DIR" != "." ] && [ ! -d "$PARENT_DIR" ]; then
                  mkdir -p "$PARENT_DIR"
                  touch "$PARENT_DIR/.gitkeep"
                  echo "✅ Created parent: $PARENT_DIR/"
                fi
                if [ ! -f "$asset" ]; then
                  touch "$asset"
                  echo "✅ Created placeholder: $asset"
                fi
              fi
            done
          fi

          echo ""
          echo "=========================================="
          echo "=== FIX 3: Java InputType ==="
          echo "=========================================="

          JAVA_FILE="android/app/src/main/java/com/nullx/pp/LockOverlayService.java"
          if [ -f "$JAVA_FILE" ]; then
            echo "Fixing: $JAVA_FILE"
            cp "$JAVA_FILE" "$JAVA_FILE.bak"

            sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD)/g' "$JAVA_FILE"

            if grep -q "TYPE_NUMBER_PASSWORD" "$JAVA_FILE"; then
              echo "❌ Fix failed, masih ada TYPE_NUMBER_PASSWORD"
              if ! grep -q "import android.text.InputType" "$JAVA_FILE"; then
                sed -i '1s/^/import android.text.InputType;\n/' "$JAVA_FILE"
              fi
              sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/129/g' "$JAVA_FILE"
              echo "✅ Fixed with numeric value 129"
            else
              echo "✅ TYPE_NUMBER_PASSWORD fixed"
            fi
          else
            echo "⚠️ LockOverlayService.java not found, searching..."
            find android -name "*.java" -type f | while read f; do
              if grep -l "TYPE_NUMBER_PASSWORD" "$f" 2>/dev/null; then
                echo "Found in: $f"
                sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD)/g' "$f"
                echo "✅ Fixed: $f"
              fi
            done
          fi

          echo ""
          echo "=========================================="
          echo "=== ALL FIXES COMPLETE ==="
          echo "=========================================="

          echo ""
          echo "=== Verification ==="
          echo "compileSdk values:"
          grep -rn "compileSdk" android/ 2>/dev/null | grep -v ".bak" | head -10
          echo ""
          echo "Asset directories:"
          ls -d assets/*/ 2>/dev/null || echo "(no asset dirs)"
          echo ""
          echo "TYPE_NUMBER_PASSWORD occurrences:"
          grep -rn "TYPE_NUMBER_PASSWORD" android/ 2>/dev/null || echo "✅ None found (FIXED!)"

      - name: Set Build Type
        id: build_info
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="apk-debug"
          fi
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "Build type: $BUILD_TYPE"

      # ============================================
      # 📦 FLUTTER PUB GET (dengan auto-fix dependensi)
      # ============================================
      - name: Flutter Pub Get
        id: pub_get
        run: |
          flutter config --no-analytics
          dart --disable-analytics

          echo "=== Attempt 1: flutter pub get ==="
          set +e
          flutter pub get 2>&1 | tee pub_get_log.txt
          PUB_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$PUB_EXIT_CODE" -eq 0 ]; then
            echo "✅ Pub get berhasil di percobaan pertama"
            exit 0
          fi

          echo ""
          echo "⚠️ Pub get gagal, menganalisis error log untuk auto-fix..."
          echo ""
          echo "=== FULL ERROR LOG (Attempt 1) ==="
          cat pub_get_log.txt
          echo ""

          # --- PRIORITAS 0: versi Dart/Flutter kurang tinggi dari yang diminta project/package ---
          #     "Because movie22 requires SDK version >=3.10.0-0 <4.0.0 ... current Dart SDK version is 3.8.1"
          if grep -qE "requires SDK version|current Dart SDK version is" pub_get_log.txt; then
            echo "🔧 AUTO-FIX: SDK Dart/Flutter terlalu lama, upgrade Flutter otomatis..."
            source /tmp/flutter_pick.sh
            REQ=$(grep -oP 'requires SDK version >=\K[0-9]+\.[0-9]+' pub_get_log.txt | sort -V | tail -1 || true)
            WANT=$(dart_to_flutter "${REQ:-3.10}")
            FR=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
            echo "   butuh Dart >= ${REQ:-?} -> target Flutter $WANT (root: $FR)"
            git -C "$FR" fetch --tags --force origin >/dev/null 2>&1 || true
            TAGS=$(git -C "$FR" tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
            case "$WANT" in
              latest) TAG=$(echo "$TAGS" | tail -1) ;;
              *.x)    TAG=$(echo "$TAGS" | grep -E "^${WANT%.x}\." | tail -1) ;;
              *)      TAG="$WANT" ;;
            esac

            if [ -n "$TAG" ] && git -C "$FR" checkout -f "$TAG" >/dev/null 2>&1; then
              echo "✅ Flutter dipindah ke $TAG"
              flutter --version 2>&1 | tee -a pub_get_log.txt
              cp pub_get_log.txt pub_get_log_sdk_before.txt
              set +e
              flutter pub get 2>&1 | tee pub_get_log_sdk.txt
              SDK_EXIT=${PIPESTATUS[0]}
              set -e
              if [ "$SDK_EXIT" -eq 0 ]; then
                echo "✅ Pub get berhasil setelah upgrade Flutter ke $TAG"
                exit 0
              fi
              if grep -qE "requires SDK version|current Dart SDK version is" pub_get_log_sdk.txt; then
                echo "###BOT_ERROR_START###"
                echo "❌ SDK masih belum cocok setelah upgrade ke Flutter $TAG:"
                grep -E "requires SDK version|current Dart SDK version is" pub_get_log_sdk.txt | sort -u | head -6
                echo "###BOT_ERROR_END###"
                exit 1
              fi
              echo "⚠️ SDK sudah cocok, tapi ada error lain -> lanjut auto-fix dependensi"
              cp pub_get_log_sdk.txt pub_get_log.txt
            else
              echo "⚠️ Gagal pindah ke Flutter '$TAG' (tag tidak ditemukan)"
            fi
          fi

          FIXED_SOMETHING=0

          # --- PRIORITAS 1: parse saran RESMI dari pub, contoh:
          #     "Consider downgrading your constraint on X: flutter pub add X:^1.2.3"
          SUGGESTED_CMDS=$(grep -oP "flutter pub add \K[a-zA-Z0-9_]+:\^?[0-9a-zA-Z.\-]+" pub_get_log.txt | sort -u || true)

          if [ -n "$SUGGESTED_CMDS" ]; then
            echo "🔍 Saran resmi dari pub ditemukan:"
            echo "$SUGGESTED_CMDS"
            echo ""
            for cmd in $SUGGESTED_CMDS; do
              echo "📦 Menjalankan saran resmi: flutter pub add $cmd"
              if flutter pub add "$cmd" 2>&1 | tee -a pub_get_log.txt; then
                FIXED_SOMETHING=1
              else
                echo "  ⚠️ Gagal menjalankan saran untuk $cmd"
              fi
              echo ""
            done
          fi

          # --- PRIORITAS 2 (fallback lama): tebak nama package hilang dari pola error umum ---
          if [ "$FIXED_SOMETHING" -eq 0 ]; then
            echo "🔍 Tidak ada saran resmi, mencoba pola fallback lama..."

            P1=$(grep -oP "(?<=[Bb]ecause )[a-z0-9_]+(?= (from|>=|<=|version|does))" pub_get_log.txt 2>/dev/null | sort -u || true)
            P2=$(grep -oP "(?<=no versions of )[a-z0-9_]+" pub_get_log.txt 2>/dev/null | sort -u || true)
            P3=$(grep -oP "(?<=[Pp]ackage )'?[a-z0-9_]+" pub_get_log.txt 2>/dev/null | tr -d "'" | sort -u || true)
            P4=$(grep -oP "'\K[a-z0-9_]+(?=' (doesn't exist|has no))" pub_get_log.txt 2>/dev/null | sort -u || true)
            P5=$(grep -oP "package:\K[a-z0-9_]+" pub_get_log.txt 2>/dev/null | sort -u || true)

            ALL_MISSING=$(printf "%s\n%s\n%s\n%s\n%s\n" "$P1" "$P2" "$P3" "$P4" "$P5" \
              | sort -u | grep -v '^$' \
              | grep -vE '^(flutter|dart|sdk|and|or|the|a|to|of|is|in|for|from)$' || true)

            if [ -n "$ALL_MISSING" ]; then
              echo "🔍 Kandidat package bermasalah (fallback):"
              echo "$ALL_MISSING"
              echo ""
              for pkg in $ALL_MISSING; do
                echo "📦 Mencoba menambahkan dependensi: $pkg"
                if flutter pub add "$pkg" 2>&1 | tee -a pub_get_log.txt; then
                  FIXED_SOMETHING=1
                else
                  echo "  ⚠️ Gagal menambahkan '$pkg' (kemungkinan bukan nama package pub.dev yang valid, dilewati)"
                fi
                echo ""
              done
            fi
          fi

          if [ "$FIXED_SOMETHING" -eq 0 ]; then
            echo ""
            echo "❌❌❌ PUB GET GAGAL - TIDAK ADA KANDIDAT YANG BISA DIAUTO-FIX ❌❌❌"
            echo ""
            echo "###BOT_ERROR_START###"
            echo "❌ Pub get gagal (dependency resolution error):"
            echo ""
            grep -E "^([Bb]ecause|[Tt]he|>|✗|[Ee]rror)" pub_get_log.txt | sort -u || tail -20 pub_get_log.txt
            echo "###BOT_ERROR_END###"
            exit 1
          fi

          echo "=== Attempt 2: flutter pub get (setelah auto-fix pubspec) ==="
          set +e
          flutter pub get 2>&1 | tee pub_get_log_retry.txt
          PUB_EXIT_CODE_2=${PIPESTATUS[0]}
          set -e

          if [ "$PUB_EXIT_CODE_2" -eq 0 ]; then
            echo "✅ Pub get berhasil setelah auto-fix dependensi!"
            echo ""
            echo "--- pubspec.yaml (dependencies) setelah auto-fix ---"
            sed -n '/^dependencies:/,/^dev_dependencies:/p' pubspec.yaml
            exit 0
          else
            echo ""
            echo "❌❌❌ PUB GET MASIH GAGAL SETELAH AUTO-FIX ❌❌❌"
            echo ""
            echo "###BOT_ERROR_START###"
            echo "❌ Pub get masih gagal setelah auto-fix dependensi:"
            echo ""
            grep -E "^([Bb]ecause|[Tt]he|>|✗|[Ee]rror)" pub_get_log_retry.txt | sort -u || tail -20 pub_get_log_retry.txt
            echo "###BOT_ERROR_END###"
            exit 1
          fi

      - name: Upload Pub Get Error Log
        if: failure() && steps.pub_get.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pub-get-error-log-${{ github.run_number }}
          path: |
            pub_get_log.txt
            pub_get_log_retry.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: 🗜️ Optimize Assets (kecilkan ukuran APK)
        if: steps.build_info.outputs.build_type != 'apk-debug'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "=== OPTIMIZE ASSETS ==="
          sudo timeout 90 apt-get install -y -qq optipng jpegoptim >/dev/null 2>&1 || echo "⚠️ optipng/jpegoptim gagal dipasang, dilewati"
          DIRS=""
          for d in assets android/app/src/main/res; do [ -d "$d" ] && DIRS="$DIRS $d"; done
          if [ -n "$DIRS" ]; then
            BEFORE=$(du -sk $DIRS | awk '{s+=$1} END{print s}')
            if command -v optipng >/dev/null 2>&1; then
              find $DIRS -type f -iname "*.png" ! -name "*.9.png" ! -name "ic_launcher*" -size +20k -print0 | xargs -0 -r -P4 -n1 optipng -quiet -o2 -strip all || true
            fi
            if command -v jpegoptim >/dev/null 2>&1; then
              find $DIRS -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -size +30k -print0 | xargs -0 -r -P4 -n1 jpegoptim --strip-all -m85 -q || true
            fi
            AFTER=$(du -sk $DIRS | awk '{s+=$1} END{print s}')
            echo "📉 Aset: ${BEFORE}KB -> ${AFTER}KB"
          fi

      - name: 🛠️ Prepare Auto-Fix Helper
        run: |
          cat > /tmp/autofix.sh << 'AUTOFIX_EOF'
          #!/usr/bin/env bash
          # ===== AUTO-FIX HELPER (di-source oleh step build) =====
          EXTRA=()          # flag tambahan untuk flutter build (mis. --no-shrink)
          APPLIED=()        # daftar fix yang sudah diterapkan
          GP="android/gradle.properties"

          _applied() { local k="$1"; for a in "${APPLIED[@]:-}"; do [ "$a" = "$k" ] && return 0; done; return 1; }
          _mark()    { APPLIED+=("$1"); echo "  🔧 AUTO-FIX: $2"; }
          _gradle_files() { find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null; }
          _plugin_gradles() { find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" -path "*/android/build.gradle*" -type f 2>/dev/null; }
          _set_compile() {   # $1 = versi, edit project + plugin pub-cache
            local v="$1" f
            for f in $(_gradle_files) $(_plugin_gradles); do
              sed -i -E "s/compileSdkVersion\s*=?\s*[0-9]+/compileSdkVersion $v/g; s/compileSdk\s*=\s*[0-9]+/compileSdk = $v/g; s/compileSdk\s+[0-9]+/compileSdk $v/g; s/compileSdk\([0-9]+\)/compileSdk($v)/g" "$f" 2>/dev/null || true
            done
          }
          _set_minsdk() {    # $1 = versi
            local v="$1" f
            for f in $(_gradle_files); do
              sed -i -E "s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion $v/g; s/minSdkVersion\s*=?\s*[0-9]+/minSdkVersion $v/g; s/minSdk\s*=\s*(flutter\.minSdkVersion|[0-9]+)/minSdk = $v/g; s/minSdk\((flutter\.minSdkVersion|[0-9]+)\)/minSdk($v)/g; s/minSdk\s+[0-9]+/minSdk $v/g" "$f" 2>/dev/null || true
            done
          }
          _gp_set() {        # $1 = key, $2 = value
            mkdir -p android; touch "$GP"
            if grep -q "^$1=" "$GP"; then sed -i "s|^$1=.*|$1=$2|" "$GP"; else echo "$1=$2" >> "$GP"; fi
          }

          # return 0 = ada perubahan / layak di-retry, 1 = tidak ada yang bisa di-fix
          apply_autofix() {
            local LOG="$1" CHANGED=1 n

            # 1) Plugin lama tanpa namespace (AGP 8+)
            if grep -qiE "Namespace not specified|namespace.*(is not|isn't) (specified|set)" "$LOG" && ! _applied namespace; then
              local cnt=0 f pkg
              for f in $(_plugin_gradles); do
                grep -q "namespace" "$f" && continue
                local mf; mf="$(dirname "$f")/src/main/AndroidManifest.xml"
                [ -f "$mf" ] || continue
                pkg=$(grep -oP 'package="\K[^"]+' "$mf" | head -1)
                [ -n "$pkg" ] || continue
                sed -i -E "0,/android\s*\{/s//android {\n    namespace \"$pkg\"/" "$f" && cnt=$((cnt+1))
              done
              _mark namespace "namespace ditambahkan ke $cnt plugin lama"; CHANGED=0
            fi

            # 2) compileSdk terlalu rendah
            n=$(grep -oP "compile against version \K[0-9]+" "$LOG" | sort -n | tail -1)
            if [ -z "$n" ]; then n=$(grep -oP "requires Android SDK version \K[0-9]+" "$LOG" | sort -n | tail -1); fi
            if [ -n "$n" ] && ! _applied "compileSdk$n"; then
              [ "$n" -lt 36 ] && n=36
              _set_compile "$n"; _mark "compileSdk$n" "compileSdk -> $n"; CHANGED=0
            elif grep -qE "android:attr/(lStar|foreground)|resource android:attr.*not found" "$LOG" && ! _applied compileSdkAttr; then
              _set_compile 36; _mark compileSdkAttr "compileSdk -> 36 (resource attr not found)"; CHANGED=0
            fi

            # 3) minSdk lebih kecil dari yang diminta library
            n=$(grep -oP "minSdkVersion [0-9]+ cannot be smaller than version \K[0-9]+" "$LOG" | sort -n | tail -1)
            if [ -n "$n" ] && ! _applied "minSdk$n"; then
              _set_minsdk "$n"; _mark "minSdk$n" "minSdk -> $n"; CHANGED=0
            fi

            # 4) Kotlin metadata / versi tidak cocok
            if grep -qiE "incompatible version of Kotlin|binary version of its metadata|Kotlin Gradle plugin.*(not|older)|Unsupported Kotlin" "$LOG" && ! _applied kotlin; then
              for f in android/build.gradle android/build.gradle.kts; do
                [ -f "$f" ] && sed -i -E "s/ext\.kotlin_version\s*=\s*['\"][^'\"]*['\"]/ext.kotlin_version = '2.1.0'/; s/(kotlin_version\s*=\s*)['\"][^'\"]*['\"]/\1'2.1.0'/" "$f"
              done
              for f in android/settings.gradle android/settings.gradle.kts; do
                [ -f "$f" ] && sed -i -E "s/(org\.jetbrains\.kotlin\.android[\"'][^\"']*version[\"' ]+)[\"'][0-9.]+[\"']/\1\"2.1.0\"/" "$f"
              done
              _mark kotlin "Kotlin -> 2.1.0"; CHANGED=0
            fi

            # 5) JVM target mismatch Java vs Kotlin
            if grep -qiE "Inconsistent JVM-target compatibility|jvmTarget" "$LOG" && ! _applied jvm; then
              _gp_set kotlin.jvm.target.validation.mode IGNORE
              _mark jvm "kotlin.jvm.target.validation.mode=IGNORE"; CHANGED=0
            fi

            # 6) R8 / minify: class hilang
            if grep -qiE "Missing classes detected while running R8|R8: |minifyReleaseWithR8" "$LOG" && ! _applied r8; then
              EXTRA+=(--no-shrink)
              _mark r8 "build ulang dengan --no-shrink (R8 error)"; CHANGED=0
            fi

            # 7) Out of memory
            if grep -qiE "Java heap space|GC overhead|OutOfMemoryError|Metaspace|Daemon will be stopped|Expiring Daemon" "$LOG" && ! _applied oom; then
              _gp_set org.gradle.jvmargs "-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
              _mark oom "Gradle heap -> 5g"; CHANGED=0
            fi

            # 8) Asset hilang
            local assets; assets=$(grep -oP "(No file or variants found for asset: |unable to find directory entry in pubspec.yaml: )\K\S+" "$LOG" | tr -d "'\"." | sort -u)
            if [ -n "$assets" ] && ! _applied assets; then
              for a in $assets; do
                a="${a%.}"
                case "$a" in */) mkdir -p "$a"; touch "$a/.gitkeep" ;; *) mkdir -p "$(dirname "$a")"; touch "$a" ;; esac
                echo "    + placeholder: $a"
              done
              _mark assets "asset hilang dibuatkan placeholder"; CHANGED=0
            fi

            # 9) Lisensi SDK / NDK rusak / build-tools
            if grep -qiE "licenses? (have|has) not been accepted|Failed to install the following Android SDK packages" "$LOG" && ! _applied licenses; then
              yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
              yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
              _mark licenses "lisensi Android SDK diterima"; CHANGED=0
            fi
            if grep -qiE "NDK .*(did not have a source.properties|is not installed|corrupt)|\[CXX1101\]" "$LOG" && ! _applied ndk; then
              for d in "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/*; do [ -d "$d" ] && [ ! -f "$d/source.properties" ] && rm -rf "$d"; done
              _mark ndk "NDK rusak dibersihkan"; CHANGED=0
            fi

            # 10) Gangguan jaringan -> cukup retry
            if grep -qiE "Could not (resolve|download|GET)|Read timed out|Connection (reset|timed out|refused)|Premature end of Content-Length|Received fatal alert|Could not HEAD" "$LOG" && ! _applied "net$3"; then
              _mark "net$3" "gangguan jaringan -> retry"; sleep 10; CHANGED=0
            fi

            # 11) Fallback terakhir: clean total (sekali)
            if [ "$CHANGED" -ne 0 ] && ! _applied clean; then
              echo "  ⚠️ Pola error tidak dikenal -> flutter clean + hapus cache Gradle, lalu coba lagi"
              flutter clean >/dev/null 2>&1 || true
              rm -rf android/.gradle android/build build "$HOME/.gradle/caches/transforms-"* 2>/dev/null || true
              flutter pub get >/dev/null 2>&1 || true
              _mark clean "clean build"; CHANGED=0
            fi
            return $CHANGED
          }

          # pemakaian: build_with_autofix <perintah flutter build ...>
          build_with_autofix() {
            local MAX=6 attempt EXIT
            for attempt in $(seq 1 $MAX); do
              echo "=========================================="
              echo "=== BUILD attempt $attempt/$MAX ${EXTRA[*]:-} ==="
              echo "=========================================="
              set +e
              "$@" "${EXTRA[@]}" 2>&1 | tee build_log.txt
              EXIT=${PIPESTATUS[0]}
              set -e
              [ "$EXIT" -eq 0 ] && { [ ${#APPLIED[@]} -gt 0 ] && echo "✅ Berhasil setelah auto-fix: ${APPLIED[*]}"; return 0; }
              [ "$attempt" -lt "$MAX" ] || break
              echo ""
              echo "🛠️ Build gagal, mencoba auto-fix (attempt $attempt)..."
              cp build_log.txt "build_log_attempt_$attempt.txt"
              if ! apply_autofix build_log.txt x "$attempt"; then echo "❌ Tidak ada auto-fix yang cocok"; break; fi
              echo "🔄 Mengulang build setelah auto-fix..."
            done
            return 1
          }

          AUTOFIX_EOF
          bash -n /tmp/autofix.sh && echo "✅ Auto-fix helper siap"

      - name: Build APK Debug
        if: steps.build_info.outputs.build_type == 'apk-debug'
        run: |
          source /tmp/autofix.sh
          if ! build_with_autofix flutter build apk --debug --no-shrink --target-platform android-arm,android-arm64,android-x64; then
            echo "###BOT_ERROR_START###"
            echo "❌ Build APK Debug gagal (sudah dicoba auto-fix: ${APPLIED[*]:-tidak ada fix yang cocok})."
            echo ""
            grep -E "Error:|error:|FAILURE|Exception|Execution failed|BUILD FAILED|What went wrong|Could not|not found" build_log.txt | sort -u | tail -25 || tail -30 build_log.txt
            echo "###BOT_ERROR_END###"
            exit 1
          fi
          echo "✅ Build APK Debug selesai"

      - name: Build APK Release
        if: steps.build_info.outputs.build_type == 'apk-release'
        run: |
          source /tmp/autofix.sh
          if ! build_with_autofix flutter build apk --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm64 --tree-shake-icons; then
            echo "###BOT_ERROR_START###"
            echo "❌ Build APK Release gagal (sudah dicoba auto-fix: ${APPLIED[*]:-tidak ada fix yang cocok})."
            echo ""
            grep -E "Error:|error:|FAILURE|Exception|Execution failed|BUILD FAILED|What went wrong|Could not|not found" build_log.txt | sort -u | tail -25 || tail -30 build_log.txt
            echo "###BOT_ERROR_END###"
            exit 1
          fi
          echo "✅ Build APK Release selesai"

      - name: Build AAB Release
        if: steps.build_info.outputs.build_type == 'aab-release'
        run: |
          source /tmp/autofix.sh
          if ! build_with_autofix flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info; then
            echo "###BOT_ERROR_START###"
            echo "❌ Build AAB Release gagal (sudah dicoba auto-fix: ${APPLIED[*]:-tidak ada fix yang cocok})."
            echo ""
            grep -E "Error:|error:|FAILURE|Exception|Execution failed|BUILD FAILED|What went wrong|Could not|not found" build_log.txt | sort -u | tail -25 || tail -30 build_log.txt
            echo "###BOT_ERROR_END###"
            exit 1
          fi
          echo "✅ Build AAB Release selesai"

      - name: Upload Build Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log-${{ github.run_number }}
          path: build_log.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Prepare Output Files
        run: |
          mkdir -p output
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')

          if [ "$BUILD_TYPE" = "apk-debug" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_debug_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "apk-release" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "aab-release" ]; then
            AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
            cp "$AAB_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.aab"
          fi

          echo "Output files:"
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ steps.build_info.outputs.build_type }}-${{ github.run_number }}
          path: output/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Flutter Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ steps.build_info.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | ${{ steps.flutter_ver.outputs.version || '3.32.8 (default)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh output/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
